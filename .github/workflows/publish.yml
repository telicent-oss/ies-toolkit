name: Release to PyPI

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
  workflow_dispatch:

jobs:
  get-version:
    uses: telicent-oss/shared-workflows/.github/workflows/python-get-version-number.yml@main

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pypa/build
        run: python -m pip install build

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/telicent-ies-toolkit

    permissions:
      id-token: write  # OIDC trusted publishing; no API token stored

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d  # v1.14.0

  do-github-release:
    needs:
      - publish-to-pypi
      - get-version
    uses: telicent-oss/shared-workflows/.github/workflows/python-gh-release.yml@main
    with:
      VERSION: ${{ needs.get-version.outputs.version }}
